name: Forge test
on:
  push:

jobs:
  test:
    runs-on: macos-latest
    env:
      ETH_NODE_URI_MAINNET: ${{ secrets.ETH_NODE_URI_MAINNET }}
      ETH_NODE_URI_ARBITRUM: ${{ secrets.ETH_NODE_URI_ARBITRUM }}
      ETH_NODE_URI_OPTIMISM: ${{ secrets.ETH_NODE_URI_OPTIMISM }}
      ETH_NODE_URI_POLYGON: ${{ secrets.ETH_NODE_URI_POLYGON }}
      ETH_NODE_URI_BASE: ${{ secrets.ETH_NODE_URI_BASE }}
      ETH_NODE_URI_MONAD: ${{ secrets.ETH_NODE_URI_MONAD }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ATLAS_PAT_TOKEN }}

      - name: Setup Git credentials for submodules
        run: |
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.ATLAS_PAT_TOKEN }}@github.com" > ~/.git-credentials
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Debug submodule info
        run: |
          echo "Listing .gitmodules:"
          cat .gitmodules
          echo "Git submodule status:"
          git submodule status
          echo "Attempting submodule update..."

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Install dependencies
        run: yarn install --immutable || true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5

      - name: Install deps
        run: forge install

      - name: Run forge tests
        run: forge test --ffi
