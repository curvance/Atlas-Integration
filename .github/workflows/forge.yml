name: Forge test
on:
  push:

jobs:
  test:
    runs-on: macos-latest
    env:
      ETH_NODE_URI_MAINNET: ${{ secrets.ETH_NODE_URI_MAINNET }}
      ETH_NODE_URI_ARBITRUM: ${{ secrets.ETH_NODE_URI_ARBITRUM }}
      ETH_NODE_URI_OPTIMISM: ${{ secrets.ETH_NODE_URI_OPTIMISM }}
      ETH_NODE_URI_POLYGON: ${{ secrets.ETH_NODE_URI_POLYGON }}
      ETH_NODE_URI_BASE: ${{ secrets.ETH_NODE_URI_BASE }}
      ETH_NODE_URI_MONAD: ${{ secrets.ETH_NODE_URI_MONAD }}
    steps:
      - name: Configure git for private submodules
        run: git config --global url."https://${{ secrets.ATLAS_PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.ATLAS_PAT_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable || true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install deps
        run: forge install

      - name: Run forge tests
        run: forge test --ffi
