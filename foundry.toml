[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./" }]
solc_version = '0.8.28'
evm_version = 'cancun'
auto_detect_solc = false
via-ir = true
optimizer_runs = 20
remappings = [
    "@atlas/=lib/atlas/src/",
    "contracts/=lib/curvance-contracts/contracts/",
    "tests/=lib/curvance-contracts/tests/"
]